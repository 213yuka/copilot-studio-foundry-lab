# Workflow YAML — 概念サンプル (公式準拠版)
#
# ⚠️ 本ファイルは公式 schema ではなく、Copilot Studio Topic を Workflow に翻訳すると
#    どういう構造になるかを示す「概念対応表」です。
#    Workflow YAML スキーマは Public Preview のため変動し、本書執筆時点で
#    公式仕様書は未公開です。実際にデプロイする際は Foundry ポータルの
#    ビジュアル ビルダーで作成して YAML を export するか、
#    microsoft-foundry/foundry-samples の最新サンプルを参照してください。
#
# 公式 (concepts/workflow) の Common node types:
#   - Agent (生成 / 推論)
#   - Logic (IfElse / Loop / Switch)
#   - Data transformation (Set variable / Parse)
#   - Basic chat (AskAQuestion / SendMessage)
# 上記以外 (HumanInTheLoop / ToolCall / Choice 等) は **公式 node type には存在しない**
# ため、本ファイルでは下記の方針に修正しています:
#   - HumanInTheLoop → ポータルの "HITL workflow template" を別ワークフローとして作成し、
#     本ワークフローからは Workflow を呼び出す形に変更 (本ファイルでは概念コメント化)
#   - ToolCall → 子エージェント (ticket_api を attach した Prompt agent) を InvokeAgent で呼ぶ
#   - Choice (expectedResponse.type) → 公式に "Not supported"。String に変更し、
#     プロンプトで選択肢を明示する
#
# triggers: ブロックは **公式 YAML 仕様に該当フィールドが無い** ため、呼出元 Prompt agent の
# Instructions / Description で発火条件を制御する設計に変更しています。

name: password-reset
description: パスワード忘れ・ロックアウトの初動対応 (Copilot Studio PasswordReset Topic からの移行)
# schemaVersion は公式スキーマ未公開のためコメント化。
# schemaVersion: "2025-05-preview"

# ----- 公式 YAML 仕様に該当フィールドが無いためコメント化 -----
# 呼出元 Prompt agent の Instructions に下記を含めることで発火制御:
#   - "パスワードを忘れた" / "パスワード リセット" / "ロックアウト" /
#     "サインインできない" のいずれかに該当する場合、このワークフローを呼び出してください
# triggers:
#   - phrases:
#       - "パスワードを忘れた"
#       - "パスワード リセット"
#       - "ロックアウト"
#       - "サインインできない"

nodes:
  - id: start
    type: Start

  # Copilot Studio の Question ノード相当。
  # 公式 "Use literal values in a formula" 表で Choice は "Not supported" のため、
  # String 型 + プロンプト内で選択肢を明示する設計に変更。
  - id: ask_pc_type
    type: AskAQuestion
    prompt: "社内 PC からのご利用ですか、社外 PC ですか? (社内 / 社外 とご入力ください)"
    expectedResponse:
      type: String
    saveAs: Local.PC
    next: branch_pc

  # Copilot Studio の Condition (Power Fx) 相当
  - id: branch_pc
    type: IfElse
    condition: =Local.PC = "社内"
    onTrue: invoke_internal
    onFalse: invoke_external

  # 子エージェント (Prompt agent) を呼ぶ — Copilot Studio の "別 Topic に Redirect" 相当
  - id: invoke_internal
    type: InvokeAgent
    agent: InternalGuideAgent
    input: =System.LastMessage.Text
    next: confirm_resolved

  - id: invoke_external
    type: InvokeAgent
    agent: ExternalGuideAgent
    input: =System.LastMessage.Text
    next: confirm_resolved

  - id: confirm_resolved
    type: AskAQuestion
    prompt: "上記の手順で解決しましたか? (はい / いいえ とご入力ください)"
    expectedResponse:
      type: String
    saveAs: Local.Resolved
    next: branch_resolved

  - id: branch_resolved
    type: IfElse
    condition: =Local.Resolved = "いいえ"
    onTrue: invoke_ticket_agent
    onFalse: end_ok

  # ----- HumanInTheLoop は公式 node type に存在しないためコメント化 -----
  # HITL を実装する場合は、Foundry ポータルの "Human-in-the-loop" workflow template を
  # 別ワークフロー (例: helpdesk-approval) として作成し、ここから InvokeWorkflow で
  # 呼び出してください。詳細は README §5.3b 参照。
  # - id: hitl_approve
  #   type: HumanInTheLoop
  #   assignTo: helpdesk-team
  #   promptToAssignee: "ユーザーがチケット起票を希望しています。承認してください。"
  #   next: invoke_ticket_agent

  # Copilot Studio の Action (HTTP) 相当を、ticket_api OpenAPI tool を attach した
  # 子エージェント (TicketAgent) を InvokeAgent で呼ぶ設計に変更。
  # 子エージェント側で create_ticket tool を呼び出してチケット起票する。
  - id: invoke_ticket_agent
    type: InvokeAgent
    agent: TicketAgent
    input: |
      ユーザーから次の問題報告を受け取りました。create_ticket ツールを呼んで
      チケットを起票してください (priority=medium, category=account, user_consent=true)。
      内容: =System.LastMessage.Text
    next: end_ok

  - id: end_ok
    type: End
    message: "ご対応ありがとうございました。"

