# Workflow YAML — 概念サンプル
#
# ⚠️ 本ファイルは公式 schema ではなく、Copilot Studio Topic を Workflow に翻訳すると
#    どういう構造になるかを示す「概念対応表」です。
#    Workflow YAML スキーマは Public Preview のため変動し、本書執筆時点で
#    公式仕様書は未公開です。実際にデプロイする際は Foundry ポータルの
#    ビジュアル ビルダーで作成して YAML を export するか、
#    microsoft-foundry/foundry-samples の最新サンプルを参照してください。
#
# 本ファイルに含まれる以下の表現は **公式 node type としては未確認** です:
#   - type: HumanInTheLoop  — HITL は workflow テンプレ パターンで提供される
#   - type: ToolCall        — tool は agent に attach し Invoke agent で呼ぶ
#   - expectedResponse.type: Choice — 公式仕様で Not supported とされる
# いずれも Copilot Studio Topic との対応付けを示す目的で記述しています。実装時は
# README §5.2 のノード一覧と §2.3 の互換差分に従って書き換えてください。

name: password-reset
description: パスワード忘れ・ロックアウトの初動対応 (Copilot Studio PasswordReset Topic からの移行)
schemaVersion: "2025-05-preview"   # ⚠️ 実際の値は最新サンプル要確認

# 入力ルーティング: Trigger Phrases 相当
triggers:
  - phrases:
      - "パスワードを忘れた"
      - "パスワード リセット"
      - "ロックアウト"
      - "サインインできない"

nodes:
  - id: start
    type: Start

  # Copilot Studio の Question ノード相当
  - id: ask_pc_type
    type: AskAQuestion
    prompt: "社内 PC からのご利用ですか、社外 PC ですか?"
    expectedResponse:
      type: Choice
      choices:
        - "社内"
        - "社外"
    saveAs: Local.PC
    next: branch_pc

  # Copilot Studio の Condition (Power Fx) 相当
  - id: branch_pc
    type: IfElse
    condition: =Local.PC = "社内"
    onTrue: invoke_internal
    onFalse: invoke_external

  # 子エージェント (Prompt agent) を呼ぶ — Copilot Studio の "別 Topic に Redirect" 相当
  - id: invoke_internal
    type: InvokeAgent
    agent: InternalGuideAgent
    input: =System.LastMessage.Text
    next: confirm_resolved

  - id: invoke_external
    type: InvokeAgent
    agent: ExternalGuideAgent
    input: =System.LastMessage.Text
    next: confirm_resolved

  - id: confirm_resolved
    type: AskAQuestion
    prompt: "上記の手順で解決しましたか?"
    expectedResponse:
      type: Choice
      choices:
        - "はい"
        - "いいえ"
    saveAs: Local.Resolved
    next: branch_resolved

  - id: branch_resolved
    type: IfElse
    condition: =Local.Resolved = "いいえ"
    onTrue: hitl_approve
    onFalse: end_ok

  # Copilot Studio の Escalate ノード相当
  - id: hitl_approve
    type: HumanInTheLoop
    assignTo: helpdesk-team
    promptToAssignee: "ユーザーがチケット起票を希望しています。承認してください。"
    next: create_ticket

  # Copilot Studio の Action (HTTP) 相当
  - id: create_ticket
    type: ToolCall
    tool: ticket_api
    operationId: CreateTicket
    inputMapping:
      summary: =System.LastMessage.Text
      priority: "medium"
      category: "account"
      user_consent: true
    next: end_ok

  - id: end_ok
    type: End
    message: "ご対応ありがとうございました。"
